[ABOUT]
NAME = JamPure Telemetry Out
AUTHOR = Jamstand
VERSION = 1.0
DESCRIPTION = Posts a JSON snapshot of the player car (speed, gear, rpm, fuel, laps, position) to the widget server every few hundred ms so the OBS overlays can show it live; the panel shows send status, achieved rate, the last payload and counters.

[CORE]
LAZY = PARTIAL   ; load when first opened, keep running

[WINDOW_...]
ID = main
NAME = Telemetry Out
FUNCTION_MAIN = windowMain
FUNCTION_SETTINGS = windowSettings
FLAGS = SETTINGS
SIZE = 260, 150
MIN_SIZE = 120, 80
PADDING = 8, 8
