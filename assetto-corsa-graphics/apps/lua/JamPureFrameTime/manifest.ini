[ABOUT]
NAME = JamPure Frame Time
AUTHOR = Jamstand
VERSION = 1.0
DESCRIPTION = Live frame-time panel: big fps readout, average / 1% low / worst, a colour-coded bar graph of the last 240 frames against a target fps line, plus cars, VRAM and render settings.

[CORE]
LAZY = PARTIAL   ; load when first opened, keep running

[WINDOW_...]
ID = main
NAME = Frame Time
FUNCTION_MAIN = windowMain
FUNCTION_SETTINGS = windowSettings
FLAGS = SETTINGS
SIZE = 300, 150
MIN_SIZE = 120, 80
PADDING = 8, 8
