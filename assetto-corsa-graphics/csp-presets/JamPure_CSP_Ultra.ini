[CONFIGURATION]
VERSION=1
AFFECTED_SECTIONS=GENERAL,EXTRA_FX,GRAPHICS_ADJUSTMENTS,GRASS_FX,LIGHTING_FX,PARTICLES_FX,REFLECTIONS_FX,SMART_MIRROR,SMART_SHADOWS,TRACK_ADJUSTMENTS,WINDSCREEN_FX,NICE_SCREENSHOTS,RAIN_FX,CAR_INSTRUMENTS,BRAKEDISC_FX,COLORFUL_SHADOWING

[GENERAL:OPTIMIZATIONS]
STOP_ALTERING_THREAD_AFFINITY=1
AABB_TRACKS=1
ADVANCED_CULLING=1

[GENERAL:OPTIMIZATIONS_CPU]
LIMIT_AUDIO=0
FLATTEN_NODES=1
CUSTOM_CAR_LODS=0

[GENERAL:OPTIMIZATIONS_GPU]
OPTIMIZE_MESHES_MORE=1
USE_NEW_DDS_LOADER=1

[GENERAL:PHYSICS]
ADAPTIVE_HARD_COLLISIONS=1
CUSTOM_RAYCASTING=1
USE_TEMPORAL_CACHE=1

[EXTRA_FX:BASIC]
ENABLED=1

[EXTRA_FX:HBAO]
ENABLED=1
RADIUS=2.4
EXP=2.4
BIAS=0.24

[EXTRA_FX:ASSAO]
OPACITY=1

[EXTRA_FX:SSGI]
ENABLED=1
INTENSITY=1.5
SCALE=1

[EXTRA_FX:SSLR]
ENABLED=1
TRACING_QUALITY2=3

[EXTRA_FX:MOTION_BLUR]
ENABLED=1
MULT=0.8
JITTER_MULT=1.5
QUALITY_2=2

[EXTRA_FX:VOLUMETRIC_LIGHTS]
ENABLED=1
INTENSITY_MULT=1.5
SCALE=0.32

[EXTRA_FX:FOG_BLUR]
ENABLED=1
DISTANCE_MULT=0.5

[GRAPHICS_ADJUSTMENTS:ANTIALIASING]
FFXCAS_PASS=1
FFXCAS_SHARPNESS=0.6
FXAA3_QUALITY_SUBPIX=1
FXAA3_EDGE_THRESHOLD=0.25
FXAA3_QUALITY_EDGE_THRESHOLD_MIN=0.25
FXAA3_GREEN_AS_LUMA=0
CMAA_EXTRA_SHARP=1

[GRAPHICS_ADJUSTMENTS:FSR]
ACTIVE=0
SHARPEN=0.8
QUALITY=0.75
QUALITY2=0.87

[GRAPHICS_ADJUSTMENTS:LODS]
COCKPIT_LR_FIX=0
CARS_DISTANCE_MULT=1.5
TRACK_DISTANCE_MULT=1.2

[GRAPHICS_ADJUSTMENTS:MOTION_BLUR]
EXTERIOR_MULT=4

[GRAPHICS_ADJUSTMENTS:ADAPTIVE_CLIP_PLANES]
FAR_PLANE=200000, 30000

[GRASS_FX:BASIC]
ENABLED=1
QUALITY=4

[GRASS_FX:RENDERING]
CAST_SHADOWS=1
SMOOTHER_BLENDING=1
EXTRAFX_PASS=1

[LIGHTING_FX:BASIC]
DYNAMIC_AMBIENT_AUTO_BRIGHTNESS=1
HEADLIGHTS_SPOT_MULT=1.0
BOUNCED_LIGHT_MULT=0.2

[LIGHTING_FX:SHADOWS]
ENABLED=1
HIGH_QUALITY_HEADLIGHT_SHADOWS=1
CARS_SHADOWS=3

[PARTICLES_FX:AC_PARTICLES]
SHADOWED_PARTICLES=1

[PARTICLES_FX:SMOKE]
HEATING_EXTRA=0.5

[PARTICLES_FX:SPARKS]
SPAWN_RATE=1000
LIMIT=30000

[PARTICLES_FX:MARBLES]
ENABLED=1
LIMIT=120000

[REFLECTIONS_FX:MAIN_CUBEMAP]
USE_64BPP=1

[REFLECTIONS_FX:REFRACTING_HEADLIGHTS]
USE_MULTISAMPLING=1

[SMART_MIRROR:REAL_MIRRORS]
ENABLED=1

[SMART_MIRROR:CUSTOM_RENDER_DISTANCE]
ENABLED=1
DISTANCE=1000

[SMART_SHADOWS:BASIC]
EXTERIOR_FOV_K_MAX=6
EXTERIOR_FOV_K_GAIN=2
SHARPENING=0

[TRACK_ADJUSTMENTS:MISCELLANEOUS]
USE_MULTILAYER_EXTRA_REFLECTIONS=1
TREES_RECEIVE_SHADOWS=1
TREES_A2C_DITHERING=1

[WINDSCREEN_FX:SHADOWS]
BLUR_MULT=1.5
BLUR_RANDOMIZE_MULT=1

[RAIN_FX:SCREEN_DROPS]
STYLE_CAR_CAMERAS=DISTANT
STYLE_CHASE_CAMERA=DISTANT
STYLE_FREE_CAMERA=DISTANT
DISABLE_FOR_SCREENSHOTS=1

[CAR_INSTRUMENTS:VISUALS]
DISTANT_HEADLIGHTS_GLARE=1

[BRAKEDISC_FX:WEAR]
INITIAL=1
INTENSITY=5

[COLORFUL_SHADOWING:BASIC]
ENABLED=0

[NICE_SCREENSHOTS:ACCUMULATION_AA]
SHARPENING=0.6

[NICE_SCREENSHOTS:ACCUMULATION_DOF]
ENABLED=1

[NICE_SCREENSHOTS:ACCUMULATION_BLUR]
ENABLED=1

[NICE_SCREENSHOTS:WINDOWS_IMAGING_COMPONENT]
QUALITY=100

[NICE_SCREENSHOTS:NAME_FORMAT]
MODE=CUSTOM
FORMAT_CUSTOM={Year}{Month}{Day}-{Hour}{Min}{Sec}-{TrackID}-{CarID}-{PPFilter}
