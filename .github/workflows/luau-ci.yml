# Luau CI for "Crack a Geode!" - runs scripts/check.sh (rojo build + ratcheted luau-lsp
# analyze + selene) on pushes and PRs that touch game code, the toolchain, or the weekly
# agent's files under automation/ (so every weekly PR - even a report-only one - gets a
# run). The script exits 0 on branches that are not a Crack a Geode checkout. See docs/AUTOMATION.md.
#
# Tools are downloaded by scripts/get-tools.sh at the versions pinned in rokit.toml (no
# third-party action involved) and cached between runs.
name: Luau CI

on:
  push:
    paths:
      - "src/**"
      - "default.project.json"
      - "rokit.toml"
      - "selene.toml"
      - ".luaurc"
      - "scripts/check.sh"
      - "scripts/get-tools.sh"
      - "lint/**"
      - "automation/**"
      - ".github/workflows/luau-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "default.project.json"
      - "rokit.toml"
      - "selene.toml"
      - ".luaurc"
      - "scripts/check.sh"
      - "scripts/get-tools.sh"
      - "lint/**"
      - "automation/**"
      - ".github/workflows/luau-ci.yml"

permissions:
  contents: read

# A newer push to the same branch/PR cancels the run that is still going.
concurrency:
  group: luau-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: rojo build + luau-lsp + selene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Re-use the downloaded binaries while rokit.toml (the pinned versions) is unchanged.
      - uses: actions/cache@v4
        with:
          path: ~/.luau-tools
          key: luau-tools-${{ runner.os }}-${{ hashFiles('rokit.toml') }}

      - name: Download pinned tools (rojo, luau-lsp, selene)
        run: bash scripts/get-tools.sh "$HOME/.luau-tools"

      - name: Run scripts/check.sh
        run: LUAU_TOOLS_DIR="$HOME/.luau-tools" bash scripts/check.sh

      # Raw tool output (.lint/) is kept so a red run can be inspected.
      - name: Upload .lint outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-output
          path: .lint/
          if-no-files-found: ignore
