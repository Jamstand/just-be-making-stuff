<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>vans_it · Sub Train</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
  html, body { background: transparent; }

  .train {
    position: fixed; top: 250px; right: 40px;
    width: 320px;
    padding: 16px 20px;
  }
  .train-head {
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .train-mult {
    font-family: var(--mono); font-feature-settings:'tnum' 1;
    font-size: 28px; font-weight: 600; line-height: 1;
    color: var(--rust);
    text-shadow: 0 0 18px rgba(161,74,42,0.4);
  }
  .train-in {
    font-family: var(--serif); font-style: italic;
    font-size: 16px; color: rgba(244,236,220,0.7);
    margin-left: 6px;
  }
  .train-right { text-align: right; }
  .train-resets {
    font-family: var(--mono); font-feature-settings:'tnum' 1;
    font-size: 16px; font-weight: 600;
    color: var(--paper); margin-top: 2px;
  }
  .train-bars {
    display: flex; gap: 4px;
    margin-top: 12px;
  }
  .train-bar {
    flex: 1; height: 6px;
    background: rgba(244,236,220,0.08);
    transition: background .25s ease, box-shadow .25s ease;
  }
  .train-bar.on {
    background: linear-gradient(90deg, #a14a2a, #c9974a);
    box-shadow: 0 0 8px rgba(201,151,74,0.6);
  }
  .train-bar.pulse {
    animation: train-pulse 700ms ease-out;
  }
  @keyframes train-pulse {
    0%   { transform: scaleY(1.0); }
    30%  { transform: scaleY(1.8); }
    100% { transform: scaleY(1.0); }
  }
  .train-msg {
    margin-top: 10px;
    font-family: var(--body); font-size: 12px;
    color: rgba(244,236,220,0.65);
  }
  .train-msg em {
    font-family: var(--serif); font-style: italic; color: var(--paper);
  }

  /* Hide when inactive (no recent sub) */
  .train.idle { opacity: 0; pointer-events: none; transform: translateX(20px); transition: opacity .5s, transform .5s; }
  .train.active { opacity: 1; transform: translateX(0); transition: opacity .5s, transform .5s; }
</style>
</head>
<body>
<div id="root"></div>

<script src="../vendor/react.development.js"></script>
<script src="../vendor/react-dom.development.js"></script>
<script src="../vendor/babel.min.js"></script>
<script src="../studio-sfx.js"></script>
<script src="widget-shared.js"></script>

<script type="text/babel">
function App() {
  const SLOTS    = 10;
  const WINDOW_S = parseInt(Widget.getParam('window', '300'), 10); // 5 min default
  const [count,    setCount]    = React.useState(0);
  const [lastTime, setLastTime] = React.useState(null);
  const [now,      setNow]      = React.useState(Date.now());
  const [pulseIdx, setPulseIdx] = React.useState(-1);

  // Tick every 250ms for countdown display
  React.useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 250);
    return () => clearInterval(t);
  }, []);

  // Sub event → increment + reset window
  React.useEffect(() => {
    const u = Widget.subscribe('sub', () => {
      Widget.playSFX('event.subtrain');
      setCount((c) => {
        const next = c + 1;
        setPulseIdx(Math.min(SLOTS - 1, c));
        setTimeout(() => setPulseIdx(-1), 700);
        return next;
      });
      setLastTime(Date.now());
    });
    return u;
  }, []);

  // Demo: trigger subs occasionally
  React.useEffect(() => {
    if (!Widget.demoOn) return;
    const seed = setTimeout(() => Widget.emit('sub', { name:'demo' }), 1500);
    const t = setInterval(() => Widget.emit('sub', { name:'demo' }), 9000);
    return () => { clearTimeout(seed); clearInterval(t); };
  }, []);

  // Countdown calc — reset window
  const elapsed   = lastTime ? Math.floor((now - lastTime) / 1000) : Infinity;
  const remaining = Math.max(0, WINDOW_S - elapsed);
  const active    = lastTime != null && remaining > 0;
  const mm = String(Math.floor(remaining / 60)).padStart(2, '0');
  const ss = String(remaining % 60).padStart(2, '0');

  // Auto-reset when window expires
  React.useEffect(() => {
    if (lastTime && remaining === 0) {
      const t = setTimeout(() => { setCount(0); setLastTime(null); }, 800);
      return () => clearTimeout(t);
    }
  }, [lastTime, remaining]);

  const filled = Math.min(SLOTS, count);
  const nextBonus = filled >= SLOTS ? 0 : SLOTS - filled;

  return (
    <div className={`st-card train ${active ? 'active' : 'idle'}`}>
      <div className="train-head">
        <div>
          <div className="st-eyebrow">sub train</div>
          <div style={{display:'flex', alignItems:'baseline', marginTop:2}}>
            <span className="train-mult">×{count}</span>
            <span className="train-in">in a row</span>
          </div>
        </div>
        <div className="train-right">
          <div className="st-eyebrow">resets</div>
          <div className="train-resets">{mm}:{ss}</div>
        </div>
      </div>
      <div className="train-bars">
        {Array.from({length: SLOTS}).map((_, i) => (
          <div key={i} className={`train-bar ${i < filled ? 'on' : ''} ${i === pulseIdx ? 'pulse' : ''}`}/>
        ))}
      </div>
      <div className="train-msg">
        {nextBonus > 0
          ? <><span className="st-num" style={{color:'var(--paper)', fontWeight:600}}>{nextBonus}</span> more for the next combo.</>
          : <em>Combo bonus active!</em>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<!-- USAGE
  OBS: 1920×1080 transparent. Anchored top-right under the goal bar.
  Each sub resets a countdown window — if no new sub arrives within
  ?window=SECONDS (default 300 = 5 min), the train resets to 0.
  URL params: ?window=SEC · ?demo=0
-->
</body>
</html>
