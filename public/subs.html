<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1020" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Subs" />
<link rel="manifest" href="/subs.webmanifest" />
<link rel="apple-touch-icon" href="/subs-icon.svg" />
<link rel="icon" type="image/svg+xml" href="/subs-icon.svg" />
<title>Subs — Subscription Tracker</title>
<style>
  :root {
    --bg: #0b1020;
    --bg-elev: #131a32;
    --bg-elev-2: #1b2447;
    --text: #e7ecff;
    --text-dim: #97a3c9;
    --text-faint: #6a78a5;
    --accent: #7c9cff;
    --accent-2: #b388ff;
    --danger: #ff6b85;
    --good: #5be7a9;
    --warn: #ffce5b;
    --line: #232c54;
    --radius: 14px;
    --pad: 14px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7fb;
      --bg-elev: #ffffff;
      --bg-elev-2: #eef1fa;
      --text: #161a2e;
      --text-dim: #5c668a;
      --text-faint: #8b94b5;
      --line: #e2e6f2;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body {
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100dvh;
    padding: calc(var(--safe-top) + 8px) 0 calc(var(--safe-bot) + 120px);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

  header { padding: 8px 0 18px; }
  .title { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .title small { color: var(--text-dim); font-weight: 500; margin-left: 6px; font-size: 13px; }

  .totals {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    margin: 10px 0 16px;
  }
  .card {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: var(--pad);
  }
  .totals .card { padding: 12px 14px; }
  .totals .label { color: var(--text-dim); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  .totals .amount { font-size: 22px; font-weight: 700; margin-top: 2px; }
  .totals .sub { color: var(--text-faint); font-size: 12px; margin-top: 2px; }

  .toolbar { display: flex; gap: 8px; align-items: center; margin: 4px 0 12px; flex-wrap: wrap; }
  .toolbar select, .toolbar input {
    background: var(--bg-elev); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 10px; font: inherit;
  }
  .toolbar .grow { flex: 1; min-width: 0; }

  .list { display: flex; flex-direction: column; gap: 10px; }
  .item {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 14px;
    display: grid; grid-template-columns: auto 1fr auto; gap: 12px;
    align-items: center;
    cursor: pointer;
    transition: transform .08s ease, background .12s ease;
  }
  .item:active { transform: scale(.99); }
  .badge {
    width: 40px; height: 40px; border-radius: 12px;
    display: grid; place-items: center; font-weight: 700; font-size: 16px;
    color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2));
    flex-shrink: 0;
  }
  .row-name { font-weight: 600; }
  .row-meta { color: var(--text-dim); font-size: 12px; margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; }
  .pill {
    display: inline-block; padding: 1px 8px; border-radius: 999px;
    background: var(--bg-elev-2); color: var(--text-dim); font-size: 11px;
    border: 1px solid var(--line);
  }
  .pill.due-soon { background: rgba(255, 206, 91, .15); color: var(--warn); border-color: rgba(255,206,91,.3); }
  .pill.due-past { background: rgba(255, 107, 133, .15); color: var(--danger); border-color: rgba(255,107,133,.3); }
  .row-amount { text-align: right; }
  .row-amount .a { font-weight: 700; }
  .row-amount .c { color: var(--text-faint); font-size: 11px; margin-top: 1px; }

  .empty {
    text-align: center; padding: 60px 20px; color: var(--text-dim);
    background: var(--bg-elev); border: 1px dashed var(--line); border-radius: var(--radius);
  }
  .empty .big { font-size: 40px; margin-bottom: 8px; }

  .fab {
    position: fixed;
    right: max(16px, env(safe-area-inset-right));
    bottom: calc(var(--safe-bot) + 18px);
    width: 60px; height: 60px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; border: 0; font-size: 30px; line-height: 1;
    box-shadow: 0 10px 30px rgba(124,156,255,.45);
    cursor: pointer;
    z-index: 20;
  }
  .fab:active { transform: scale(.95); }

  /* sheet/modal */
  .sheet-back {
    position: fixed; inset: 0; background: rgba(8,11,28,.55); backdrop-filter: blur(4px);
    display: none; align-items: flex-end; justify-content: center;
    z-index: 30;
  }
  .sheet-back.open { display: flex; }
  .sheet {
    background: var(--bg-elev);
    width: 100%; max-width: 560px;
    border-radius: 20px 20px 0 0;
    padding: 16px 16px calc(var(--safe-bot) + 16px);
    max-height: 92dvh; overflow-y: auto;
    border-top: 1px solid var(--line);
  }
  .sheet h2 { margin: 4px 0 14px; font-size: 18px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 5px; }
  .field input, .field select, .field textarea {
    width: 100%;
    background: var(--bg-elev-2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 12px;
    font: inherit;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent;
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .actions { display: flex; gap: 8px; margin-top: 8px; }
  .btn {
    flex: 1; padding: 12px 14px; border-radius: 12px; font: inherit; font-weight: 600;
    border: 1px solid var(--line); background: var(--bg-elev-2); color: var(--text);
    cursor: pointer;
  }
  .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border: 0; }
  .btn.danger { background: transparent; color: var(--danger); border-color: rgba(255,107,133,.4); }
  .btn:active { transform: scale(.98); }

  .menu-toggle {
    background: var(--bg-elev); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 12px; cursor: pointer; font: inherit;
  }
  .menu {
    position: absolute; right: 16px; top: 50px;
    background: var(--bg-elev); border: 1px solid var(--line);
    border-radius: 12px; padding: 6px; display: none; z-index: 25;
    box-shadow: 0 12px 30px rgba(0,0,0,.25);
    min-width: 180px;
  }
  .menu.open { display: block; }
  .menu button {
    display: block; width: 100%; text-align: left;
    background: none; border: 0; color: var(--text);
    padding: 9px 10px; border-radius: 8px; font: inherit; cursor: pointer;
  }
  .menu button:hover { background: var(--bg-elev-2); }

  .header-row { display: flex; align-items: center; justify-content: space-between; position: relative; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="header-row">
      <div class="title">Subs <small>your subscriptions</small></div>
      <button class="menu-toggle" id="menuBtn" aria-label="Menu">⋯</button>
      <div class="menu" id="menu">
        <button data-act="export">Export JSON</button>
        <button data-act="import">Import JSON</button>
        <button data-act="sample">Load sample data</button>
        <button data-act="clear">Clear all</button>
      </div>
    </div>

    <div class="totals">
      <div class="card">
        <div class="label">Per month</div>
        <div class="amount" id="totMonth">—</div>
        <div class="sub" id="totMonthSub">across 0 subs</div>
      </div>
      <div class="card">
        <div class="label">Per year</div>
        <div class="amount" id="totYear">—</div>
        <div class="sub" id="totYearSub">est. annual</div>
      </div>
    </div>

    <div class="toolbar">
      <input class="grow" type="search" id="filter" placeholder="Search name, card, category…" />
      <select id="sort">
        <option value="next">Sort: next bill</option>
        <option value="amount">Sort: amount</option>
        <option value="name">Sort: name</option>
        <option value="card">Sort: card</option>
      </select>
    </div>
  </header>

  <div id="list" class="list"></div>
</div>

<button class="fab" id="addBtn" aria-label="Add subscription">+</button>

<!-- Sheet for add/edit -->
<div class="sheet-back" id="sheetBack">
  <form class="sheet" id="form">
    <h2 id="sheetTitle">New subscription</h2>
    <input type="hidden" name="id" />

    <div class="field">
      <label>Name</label>
      <input name="name" required placeholder="Netflix" autocomplete="off" />
    </div>

    <div class="row2">
      <div class="field">
        <label>Amount</label>
        <input name="amount" type="number" step="0.01" min="0" required inputmode="decimal" placeholder="9.99" />
      </div>
      <div class="field">
        <label>Currency</label>
        <input name="currency" maxlength="6" placeholder="USD" />
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label>Cycle</label>
        <select name="cycle">
          <option value="weekly">Weekly</option>
          <option value="monthly" selected>Monthly</option>
          <option value="quarterly">Quarterly (3 mo)</option>
          <option value="biannual">Biannual (6 mo)</option>
          <option value="yearly">Yearly</option>
        </select>
      </div>
      <div class="field">
        <label>Next bill date</label>
        <input name="nextDate" type="date" required />
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label>Card (last 4)</label>
        <input name="cardLast4" maxlength="4" inputmode="numeric" pattern="[0-9]{0,4}" placeholder="1234" />
      </div>
      <div class="field">
        <label>Category</label>
        <input name="category" placeholder="Streaming" />
      </div>
    </div>

    <div class="field">
      <label>Notes</label>
      <textarea name="notes" rows="2" placeholder="Family plan, shared with…"></textarea>
    </div>

    <div class="actions">
      <button type="button" class="btn danger" id="deleteBtn" style="display:none">Delete</button>
      <button type="button" class="btn" id="cancelBtn">Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</div>

<input type="file" id="fileImport" accept="application/json" hidden />

<script>
(() => {
  const STORE_KEY = 'subs.v1';
  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => document.querySelectorAll(sel);

  // ── Data layer ──
  const load = () => {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
    catch { return []; }
  };
  const save = (subs) => localStorage.setItem(STORE_KEY, JSON.stringify(subs));
  let subs = load();

  // ── Helpers ──
  const fmtMoney = (amt, cur) => {
    const c = (cur || 'USD').toUpperCase();
    try { return new Intl.NumberFormat(undefined, { style: 'currency', currency: c, maximumFractionDigits: 2 }).format(amt); }
    catch { return `${c} ${amt.toFixed(2)}`; }
  };
  const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
  const parseDate = (s) => { const d = new Date(s + 'T00:00:00'); return isNaN(d) ? null : d; };
  const fmtDate = (d) => d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: d.getFullYear() === today().getFullYear() ? undefined : 'numeric' });
  const daysUntil = (d) => Math.round((d - today()) / 86400000);

  const cycleToMonths = { weekly: 12/52, monthly: 1, quarterly: 3, biannual: 6, yearly: 12 };
  const monthlyOf = (s) => s.amount / cycleToMonths[s.cycle];

  const rollNext = (s) => {
    let d = parseDate(s.nextDate); if (!d) return s;
    const t = today();
    while (d < t) {
      if (s.cycle === 'weekly') d.setDate(d.getDate() + 7);
      else if (s.cycle === 'monthly') d.setMonth(d.getMonth() + 1);
      else if (s.cycle === 'quarterly') d.setMonth(d.getMonth() + 3);
      else if (s.cycle === 'biannual') d.setMonth(d.getMonth() + 6);
      else if (s.cycle === 'yearly') d.setFullYear(d.getFullYear() + 1);
      else break;
    }
    s.nextDate = d.toISOString().slice(0,10);
    return s;
  };

  const badgeFor = (name) => {
    const seed = [...name].reduce((a, c) => a + c.charCodeAt(0), 0);
    const h1 = (seed * 47) % 360;
    const h2 = (h1 + 60) % 360;
    return {
      letter: (name.trim()[0] || '?').toUpperCase(),
      style: `background: linear-gradient(135deg, hsl(${h1} 80% 60%), hsl(${h2} 80% 55%));`,
    };
  };

  // ── Rendering ──
  const render = () => {
    const filterStr = $('#filter').value.trim().toLowerCase();
    const sortBy = $('#sort').value;

    subs.forEach(rollNext);
    save(subs);

    let view = subs.slice();
    if (filterStr) {
      view = view.filter(s =>
        (s.name || '').toLowerCase().includes(filterStr) ||
        (s.cardLast4 || '').includes(filterStr) ||
        (s.category || '').toLowerCase().includes(filterStr)
      );
    }
    view.sort((a, b) => {
      if (sortBy === 'next') return (parseDate(a.nextDate) || 0) - (parseDate(b.nextDate) || 0);
      if (sortBy === 'amount') return monthlyOf(b) - monthlyOf(a);
      if (sortBy === 'name') return (a.name || '').localeCompare(b.name || '');
      if (sortBy === 'card') return (a.cardLast4 || '').localeCompare(b.cardLast4 || '');
      return 0;
    });

    const list = $('#list');
    if (view.length === 0) {
      list.innerHTML = subs.length
        ? `<div class="empty"><div class="big">🔎</div><div>No matches.</div></div>`
        : `<div class="empty"><div class="big">💳</div><div>No subscriptions yet.<br/>Tap <b>+</b> to add one.</div></div>`;
    } else {
      list.innerHTML = view.map(s => {
        const b = badgeFor(s.name || '?');
        const d = parseDate(s.nextDate);
        const dleft = d ? daysUntil(d) : null;
        let datePill = '';
        if (d) {
          let cls = '';
          let text = fmtDate(d);
          if (dleft <= 0) { cls = 'due-past'; text = 'Due today'; if (dleft < 0) text = `Overdue ${-dleft}d`; }
          else if (dleft <= 7) { cls = 'due-soon'; text = `in ${dleft}d`; }
          datePill = `<span class="pill ${cls}">${text}</span>`;
        }
        const cardPill = s.cardLast4 ? `<span class="pill">•••• ${escapeHtml(s.cardLast4)}</span>` : '';
        const catPill = s.category ? `<span class="pill">${escapeHtml(s.category)}</span>` : '';
        const cyclePill = `<span class="pill">${s.cycle}</span>`;
        return `
          <div class="item" data-id="${s.id}">
            <div class="badge" style="${b.style}">${b.letter}</div>
            <div>
              <div class="row-name">${escapeHtml(s.name)}</div>
              <div class="row-meta">${datePill}${cyclePill}${cardPill}${catPill}</div>
            </div>
            <div class="row-amount">
              <div class="a">${fmtMoney(s.amount, s.currency)}</div>
              <div class="c">${fmtMoney(monthlyOf(s), s.currency)}/mo</div>
            </div>
          </div>`;
      }).join('');
    }

    // Totals — bucket by currency
    const byCur = {};
    for (const s of subs) {
      const c = (s.currency || 'USD').toUpperCase();
      byCur[c] = (byCur[c] || 0) + monthlyOf(s);
    }
    const curs = Object.keys(byCur);
    if (curs.length === 0) {
      $('#totMonth').textContent = '—';
      $('#totYear').textContent = '—';
    } else if (curs.length === 1) {
      const c = curs[0];
      $('#totMonth').textContent = fmtMoney(byCur[c], c);
      $('#totYear').textContent = fmtMoney(byCur[c] * 12, c);
    } else {
      $('#totMonth').textContent = curs.map(c => fmtMoney(byCur[c], c)).join(' + ');
      $('#totYear').textContent = curs.map(c => fmtMoney(byCur[c] * 12, c)).join(' + ');
    }
    $('#totMonthSub').textContent = `across ${subs.length} sub${subs.length === 1 ? '' : 's'}`;
  };

  const escapeHtml = (s) => String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));

  // ── Sheet (add/edit) ──
  const sheetBack = $('#sheetBack');
  const form = $('#form');

  const openSheet = (sub) => {
    form.reset();
    form.elements.id.value = sub?.id || '';
    if (sub) {
      $('#sheetTitle').textContent = 'Edit subscription';
      $('#deleteBtn').style.display = 'block';
      for (const k of ['name','amount','currency','cycle','nextDate','cardLast4','category','notes']) {
        if (form.elements[k]) form.elements[k].value = sub[k] ?? '';
      }
    } else {
      $('#sheetTitle').textContent = 'New subscription';
      $('#deleteBtn').style.display = 'none';
      form.elements.currency.value = guessCurrency();
      const d = new Date(); d.setDate(d.getDate() + 7);
      form.elements.nextDate.value = d.toISOString().slice(0,10);
    }
    sheetBack.classList.add('open');
    setTimeout(() => form.elements.name.focus(), 50);
  };
  const closeSheet = () => sheetBack.classList.remove('open');

  const guessCurrency = () => {
    try {
      const loc = new Intl.NumberFormat().resolvedOptions().locale;
      const map = { US: 'USD', GB: 'GBP', NG: 'NGN', CA: 'CAD', AU: 'AUD', IN: 'INR', ZA: 'ZAR', JP: 'JPY' };
      const region = (loc.split('-')[1] || '').toUpperCase();
      return map[region] || 'USD';
    } catch { return 'USD'; }
  };

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(form));
    const sub = {
      id: data.id || crypto.randomUUID(),
      name: data.name.trim(),
      amount: parseFloat(data.amount) || 0,
      currency: (data.currency || 'USD').trim().toUpperCase(),
      cycle: data.cycle,
      nextDate: data.nextDate,
      cardLast4: (data.cardLast4 || '').replace(/\D/g, '').slice(0, 4),
      category: data.category.trim(),
      notes: data.notes.trim(),
    };
    const i = subs.findIndex(s => s.id === sub.id);
    if (i >= 0) subs[i] = sub; else subs.push(sub);
    save(subs);
    closeSheet();
    render();
  });

  $('#cancelBtn').addEventListener('click', closeSheet);
  sheetBack.addEventListener('click', (e) => { if (e.target === sheetBack) closeSheet(); });
  $('#deleteBtn').addEventListener('click', () => {
    const id = form.elements.id.value;
    if (!id) return;
    if (!confirm('Delete this subscription?')) return;
    subs = subs.filter(s => s.id !== id);
    save(subs);
    closeSheet();
    render();
  });

  $('#addBtn').addEventListener('click', () => openSheet(null));
  $('#list').addEventListener('click', (e) => {
    const el = e.target.closest('.item');
    if (!el) return;
    const sub = subs.find(s => s.id === el.dataset.id);
    if (sub) openSheet(sub);
  });

  $('#filter').addEventListener('input', render);
  $('#sort').addEventListener('change', render);

  // ── Menu ──
  const menu = $('#menu');
  $('#menuBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    menu.classList.toggle('open');
  });
  document.addEventListener('click', () => menu.classList.remove('open'));

  menu.addEventListener('click', (e) => {
    const act = e.target.closest('button')?.dataset.act;
    if (!act) return;
    if (act === 'export') exportJson();
    if (act === 'import') $('#fileImport').click();
    if (act === 'sample') loadSample();
    if (act === 'clear') clearAll();
  });

  const exportJson = () => {
    const blob = new Blob([JSON.stringify(subs, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `subs-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  $('#fileImport').addEventListener('change', async (e) => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const arr = JSON.parse(await file.text());
      if (!Array.isArray(arr)) throw new Error('not an array');
      if (!confirm(`Import ${arr.length} subscriptions? This replaces current data.`)) return;
      subs = arr.map(s => ({
        id: s.id || crypto.randomUUID(),
        name: String(s.name || ''),
        amount: Number(s.amount) || 0,
        currency: String(s.currency || 'USD').toUpperCase(),
        cycle: ['weekly','monthly','quarterly','biannual','yearly'].includes(s.cycle) ? s.cycle : 'monthly',
        nextDate: s.nextDate || new Date().toISOString().slice(0,10),
        cardLast4: String(s.cardLast4 || '').replace(/\D/g,'').slice(0,4),
        category: String(s.category || ''),
        notes: String(s.notes || ''),
      }));
      save(subs);
      render();
    } catch (err) {
      alert('Import failed: ' + err.message);
    }
    e.target.value = '';
  });

  const loadSample = () => {
    if (subs.length && !confirm('Replace current data with sample?')) return;
    const t = new Date();
    const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x.toISOString().slice(0,10); };
    subs = [
      { id: crypto.randomUUID(), name: 'Netflix',    amount: 15.99, currency: 'USD', cycle: 'monthly',  nextDate: addDays(t, 4),  cardLast4: '4242', category: 'Streaming', notes: '' },
      { id: crypto.randomUUID(), name: 'Spotify',    amount: 11.99, currency: 'USD', cycle: 'monthly',  nextDate: addDays(t, 12), cardLast4: '4242', category: 'Music',     notes: '' },
      { id: crypto.randomUUID(), name: 'iCloud+',    amount: 2.99,  currency: 'USD', cycle: 'monthly',  nextDate: addDays(t, 1),  cardLast4: '0007', category: 'Cloud',     notes: '' },
      { id: crypto.randomUUID(), name: 'NYTimes',    amount: 25,    currency: 'USD', cycle: 'monthly',  nextDate: addDays(t, -2), cardLast4: '0007', category: 'News',      notes: '' },
      { id: crypto.randomUUID(), name: 'Domain.com', amount: 12,    currency: 'USD', cycle: 'yearly',   nextDate: addDays(t, 60), cardLast4: '4242', category: 'Tools',     notes: '' },
    ];
    save(subs);
    render();
  };

  const clearAll = () => {
    if (!subs.length) return;
    if (!confirm('Delete all subscriptions? This cannot be undone.')) return;
    subs = [];
    save(subs);
    render();
  };

  // ── Service worker (offline) ──
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/subs-sw.js').catch(() => {});
  }

  render();
})();
</script>
