# Cinematic - slower pacing, longer reel, composition-weighted selection.
assemble:
  target_duration_s: 40
  cut:
    min_shot_s: 1.0
    max_shot_s: 5.0
    slow_beats: 4
    fast_beats: 2
judge:
  weight: 0.7
analyze:
  weights:
    sharpness: 0.35
    motion: 0.20
    exposure: 0.30
    tilt: 0.15
