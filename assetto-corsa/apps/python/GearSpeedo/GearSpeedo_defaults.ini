; Gear Speedo settings.
;
; Content Manager reads the annotations after each ';' and builds a settings
; page from them: Content Manager -> Settings -> Assetto Corsa -> Apps.
; You can also just edit the values here by hand.
;
; SCALE can be changed live in-game instead: click the small "size" button in
; the corner of the widget and use the spinner. That writes back to this file.
;
; Other changes are picked up when the next session loads, not while driving.

[CONFIG]
SCALE=100 ; App scale (specifies size of the app); from 50% to 200%
UNITS=KMH ; Speed units; KMH, MPH
SHOW_SPEED=1 ; Show the speed readout; 1 or 0
OPACITY=70 ; Background opacity; from 0% to 100%
SHIFT_AT=95 ; Shift light threshold, as a share of the rev limit; from 80% to 100%
TITLE_BAR=0 ; Show a title bar to drag the widget by; 1 or 0
