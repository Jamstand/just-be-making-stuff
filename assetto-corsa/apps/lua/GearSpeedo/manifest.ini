[ABOUT]
NAME = Gear Speedo
AUTHOR = Josh
VERSION = 1.1
DESCRIPTION = Big gear indicator, road speed, and an RPM bar with shift lights. Drag the window edge to resize. The title bar stays hidden until you point at the window.
REQUIRED_VERSION = 2514
URL = https://github.com/Jamstand/just-be-making-stuff

[CORE]
LAZY = FULL

[WINDOW_...]
ID = main
NAME = Gear Speedo
ICON = icon.png
FUNCTION_MAIN = windowMain
FUNCTION_SETTINGS = windowSettings
SIZE = 280, 120
MIN_SIZE = 140, 60
MAX_SIZE = 840, 360
; Title bar. FLOATING_TITLE_BAR keeps it hidden until the mouse is over the
; window, then it floats in over the top edge with the settings gear and the
; close button. Remove that flag for a bar that is always there, or swap it
; for NO_TITLE_BAR for no bar at all (that loses the settings gear too, so
; you would open and close the app from the CSP app list). CSP reads this
; once at load, so restart the session after changing it.
FLAGS = SETTINGS, FLOATING_TITLE_BAR, NO_BACKGROUND, NO_SCROLLBAR, NO_SCROLL_WITH_MOUSE
