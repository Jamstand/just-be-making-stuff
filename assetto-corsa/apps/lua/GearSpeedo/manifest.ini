[ABOUT]
NAME = Gear Speedo
AUTHOR = Josh
VERSION = 1.2
DESCRIPTION = Big gear indicator, road speed, and an RPM bar with shift lights. Title bar and resize handle can both be switched off in its settings.
REQUIRED_VERSION = 2514
URL = https://github.com/Jamstand/just-be-making-stuff

[CORE]
LAZY = FULL

; Title bar and resize handle are decorations CSP fixes per window and cannot
; change while running, so there is one window for every combination and the
; app's settings choose which one is open. `main` is the one in the app list.
; FLOATING_TITLE_BAR keeps a title bar hidden until the mouse is over the
; window; remove it from both FLAGS lines below for a bar that is always
; there. CSP reads this file once at load, so restart the session after
; changing it.

[WINDOW_...]
ID = main
NAME = Gear Speedo
ICON = icon.png
FUNCTION_MAIN = windowMain
FUNCTION_SETTINGS = windowSettings
SIZE = 280, 120
MIN_SIZE = 140, 60
MAX_SIZE = 840, 360
FLAGS = MAIN, SETTINGS, FLOATING_TITLE_BAR, NO_BACKGROUND, NO_SCROLLBAR, NO_SCROLL_WITH_MOUSE

[WINDOW_...]
ID = bare
NAME = Gear Speedo (no title bar)
ICON = icon.png
FUNCTION_MAIN = windowBare
SIZE = 280, 120
MIN_SIZE = 140, 60
MAX_SIZE = 840, 360
FLAGS = HIDDEN, NO_TITLE_BAR, NO_BACKGROUND, NO_SCROLLBAR, NO_SCROLL_WITH_MOUSE

[WINDOW_...]
ID = fixed
NAME = Gear Speedo (fixed size)
ICON = icon.png
FUNCTION_MAIN = windowFixed
FUNCTION_SETTINGS = windowSettings
SIZE = 280, 120
MIN_SIZE = 140, 60
MAX_SIZE = 840, 360
PADDING = 0, 0
FLAGS = HIDDEN, SETTINGS, FLOATING_TITLE_BAR, AUTO_RESIZE, NO_BACKGROUND, NO_SCROLLBAR, NO_SCROLL_WITH_MOUSE

[WINDOW_...]
ID = barefixed
NAME = Gear Speedo (no title bar, fixed size)
ICON = icon.png
FUNCTION_MAIN = windowBareFixed
SIZE = 280, 120
MIN_SIZE = 140, 60
MAX_SIZE = 840, 360
PADDING = 0, 0
FLAGS = HIDDEN, NO_TITLE_BAR, AUTO_RESIZE, NO_BACKGROUND, NO_SCROLLBAR, NO_SCROLL_WITH_MOUSE
